<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIDAY · Startup</title>
  <style>
    * {margin:0;padding:0;box-sizing:border-box}
    html,body {width:100%;height:100%;overflow:hidden}
    
    body {
      background:#0a0e1a;
      font-family:'Segoe UI',sans-serif;
      color:#00e5ff;
      display:flex;align-items:center;justify-content:center;
    }

    .startup-container {
      width:100%;height:100%;
      position:relative;
      background:linear-gradient(135deg,#0a0e1a 0%,#1a2332 50%,#0f1823 100%);
      overflow:hidden;
    }

    /* Starfield Background */
    .starfield {
      position:absolute;top:0;left:0;width:100%;height:100%;
      background-image:
        radial-gradient(1px 1px at 20% 30%, white, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 60% 70%, white, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 50% 50%, white, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 80% 10%, white, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 10% 90%, white, rgba(255,255,255,0));
      background-repeat:repeat;
      background-size:200px 200px, 150px 150px, 175px 175px, 210px 210px, 180px 180px;
      background-position:0 0, 40px 60px, 130px 270px, 70px 100px, 90px 40px;
      opacity:0.5;
      z-index:1;
      animation:float 200s linear infinite;
    }

    @keyframes float {
      from {background-position:0 0, 40px 60px, 130px 270px, 70px 100px, 90px 40px}
      to {background-position:-200px 0, -160px 60px, -70px 270px, -130px 100px, -110px 40px}
    }

    /* Main Content */
    .content {
      position:relative;z-index:10;
      width:100%;height:100%;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      text-align:center;
    }

    /* Title */
    .title {
      font-size:clamp(64px,10vw,120px);
      font-weight:200;
      letter-spacing:0.2em;
      margin-bottom:20px;
      background:linear-gradient(90deg,#00e5ff 0%,#00b8d4 50%,#0097a7 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      filter:drop-shadow(0 0 30px rgba(0,229,255,0.4));
      animation:fadeInDown 1.2s cubic-bezier(0.16,0.9,0.24,1);
    }

    /* Subtitle */
    .subtitle {
      font-size:clamp(12px,2vw,18px);
      letter-spacing:0.2em;
      color:#7dd8e8;
      margin-bottom:80px;
      opacity:0;
      animation:fadeIn 1.5s ease-out 0.3s forwards;
    }

    /* Core Orb */
    .core-orb {
      width:clamp(150px,18vw,280px);
      height:clamp(150px,18vw,280px);
      border:2px solid rgba(0,229,255,0.6);
      border-radius:50%;
      margin:0 auto;
      background:radial-gradient(circle at 35% 35%, rgba(0,229,255,0.25), rgba(0,100,150,0.05));
      box-shadow:
        0 0 80px rgba(0,229,255,0.5),
        inset 0 0 60px rgba(0,229,255,0.2),
        0 0 120px rgba(0,150,200,0.3);
      position:relative;
      opacity:0;
      animation:orbGrow 1.8s cubic-bezier(0.16,0.9,0.24,1) 0.5s forwards;
    }

    .core-orb::before {
      content:'';
      position:absolute;
      top:50%;left:50%;
      transform:translate(-50%,-50%);
      width:70%;height:70%;
      border:1px solid rgba(0,229,255,0.5);
      border-radius:50%;
      animation:orbSpin 8s linear infinite;
    }

    .core-orb::after {
      content:'';
      position:absolute;
      top:50%;left:50%;
      transform:translate(-50%,-50%);
      width:40%;height:40%;
      border:1px dashed rgba(0,229,255,0.4);
      border-radius:50%;
      animation:orbSpin 4s linear reverse infinite;
    }

    @keyframes orbGrow {
      from {opacity:0;transform:scale(0)}
      to {opacity:1;transform:scale(1)}
    }

    @keyframes orbSpin {
      from {transform:translate(-50%,-50%) rotate(0deg)}
      to {transform:translate(-50%,-50%) rotate(360deg)}
    }

    /* Status Text */
    .status {
      margin-top:80px;
      font-size:14px;
      letter-spacing:0.15em;
      text-transform:uppercase;
      opacity:0;
      animation:fadeIn 1s ease-out 1.5s forwards;
    }

    .status-dot {
      display:inline-block;
      width:8px;height:8px;
      background:#00e5ff;
      border-radius:50%;
      margin-right:8px;
      animation:pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% {opacity:1;box-shadow:0 0 0 rgba(0,229,255,0.8)}
      50% {opacity:0.5;box-shadow:0 0 20px rgba(0,229,255,0.6)}
    }

    @keyframes fadeIn {
      from {opacity:0}
      to {opacity:1}
    }

    @keyframes fadeInDown {
      from {opacity:0;transform:translateY(-30px)}
      to {opacity:1;transform:translateY(0)}
    }

    /* Transition to Dashboard */
    .startup-container.complete {
      animation:fadeOut 1s ease-out forwards;
    }

    @keyframes fadeOut {
      from {opacity:1}
      to {opacity:0}
    }
  </style>
</head>
<body>
  <div class="startup-container" id="startup">
    <div class="starfield"></div>
    <div class="content">
      <h1 class="title">FRIDAY</h1>
      <p class="subtitle">Initializing Neural Core</p>
      <div class="core-orb"></div>
      <div class="status">
        <span class="status-dot"></span>
        SYSTEMS ONLINE
      </div>
    </div>
  </div>

  <script>
    // Nach 4.5s zum Dashboard wechseln
    setTimeout(() => {
      document.getElementById('startup').classList.add('complete');
      setTimeout(() => {
        window.location.href = '/panorama-dual';
      }, 1000);
    }, 4500);
  </script>
</body>
</html>
