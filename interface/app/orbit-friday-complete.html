<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FRIDAY · JARVIS HOLOGRAM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Orbitron', 'Segoe UI', monospace;
      background: #000;
      color: #00e5ff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    
    .header {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }
    
    .brand { font-size: 9px; letter-spacing: 0.5em; color: #ff9500; opacity: 0.8; }
    .title { font-size: 48px; font-weight: 300; letter-spacing: 0.3em; color: #00e5ff; text-shadow: 0 0 20px rgba(0,229,255,0.8); margin: 8px 0; }
    .subtitle { font-size: 8px; letter-spacing: 0.4em; color: #00b8d4; text-transform: uppercase; }
    
    #status {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 0.3em;
      color: #00e5ff;
      text-align: center;
      text-transform: uppercase;
    }
    
    #initiate-btn {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 50px;
      font-size: 14px;
      letter-spacing: 0.3em;
      color: #00e5ff;
      background: rgba(0,70,90,0.3);
      border: 1px solid rgba(0,229,255,0.5);
      border-radius: 50px;
      cursor: pointer;
      pointer-events: all;
      transition: all 0.3s;
      font-family: inherit;
      text-transform: uppercase;
      backdrop-filter: blur(5px);
    }
    
    #initiate-btn:hover {
      background: rgba(0,100,120,0.5);
      box-shadow: 0 0 20px rgba(0,229,255,0.4);
    }
    
    #initiate-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    
    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,229,255,0.03) 2px, rgba(0,229,255,0.03) 4px);
      pointer-events: none;
      z-index: 100;
      opacity: 0.5;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div class="overlay">
    <div class="header">
      <div class="brand">ORBIT AI ASSISTANT SYSTEM</div>
      <div class="title">FRIDAY</div>
      <div class="subtitle">Intelligence · Precision · Presence</div>
    </div>
    
    <div id="status">SYSTEM STANDBY</div>
    <button id="initiate-btn">INITIATE FRIDAY</button>
  </div>
  
  <div class="scanlines"></div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="orbit-friday-complete.js"></script>
</body>
</html>
